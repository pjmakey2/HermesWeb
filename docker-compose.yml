# Uso: scripts/deploy.sh [vX.Y.Z]   (no hace falta llamar a docker compose a mano)
#
# El contenedor corre con TU uid y ve tu $HOME en la MISMA ruta que el host, porque las rutas
# viajan entre ambos: el cwd de las sesiones, los transcripts de ~/.claude, las imágenes subidas
# (que claude lee desde el host) y el socket del servidor tmux del host.
name: hermesweb
services:
  hermesweb:
    image: hermesweb:${HERMES_VERSION:-latest}
    container_name: hermesweb
    restart: unless-stopped
    user: "${HERMES_UID:-1000}:${HERMES_GID:-1000}"
    network_mode: host            # escucha en HOST:PORT del host (127.0.0.1:7681 por defecto)
    init: false                   # tini ya es el entrypoint
    environment:
      HOME: ${HOME}
      SHELL: ${SHELL:-/bin/bash}  # shell que el tmux del host lanza para las sesiones nuevas
      HOST: ${HERMES_BIND:-127.0.0.1}
      PORT: ${HERMES_PORT:-7681}
      HERMES_HOST_LABEL: ${HERMES_HOST_LABEL:-}
      HERMES_SESSION_DAYS: ${HERMES_SESSION_DAYS:-30}
    volumes:
      - ${HOME}:${HOME}:ro                                            # proyectos, ~/.claude (solo lectura)
      - ${HOME}/.config/hermesweb:${HOME}/.config/hermesweb           # contraseña, token, tmux.conf
      - ${HOME}/.local/share/hermesweb:${HOME}/.local/share/hermesweb # base de sesiones guardadas
      - ${HOME}/.local/state/hermesweb:${HOME}/.local/state/hermesweb # socket tmux del host
      - ${HOME}/.cache/hermesweb:${HOME}/.cache/hermesweb             # imágenes subidas
