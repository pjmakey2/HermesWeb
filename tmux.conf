# Config del servidor tmux dedicado de HermesWeb (socket: -L hermes)
# el servidor sigue vivo sin sesiones (HermesWeb en Docker se conecta a él)
set -s exit-empty off
set -g status off
set -g mouse on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g window-size latest
set -g aggressive-resize on
set -g default-terminal "tmux-256color"
set -ga terminal-features "xterm*:RGB:extkeys"
set -g extended-keys on
set -g allow-set-title on
set -g set-clipboard on

# Ctrl+B lo usa Claude Code (mandar tareas a segundo plano): mover el prefijo de tmux a Ctrl+]
unbind C-b
set -g prefix C-]
bind C-] send-prefix
