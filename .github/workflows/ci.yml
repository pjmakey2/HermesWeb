# En cada push y PR: sintaxis, tests de API, tests de interfaz (navegador real) e imagen Docker.
# El deploy lo hace scripts/release.sh / scripts/deploy.sh en cada máquina (están detrás de NAT/Tailscale).
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Dependencias
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q tmux
          npm ci
          npx playwright install --with-deps chromium
      - name: Sintaxis
        run: |
          for f in server.js auth.js set-password.js lib/*.js bin/hermes-cli.js scripts/*.js public/*.js test/*.js; do node --check "$f"; done
          bash -n bin/hcw scripts/*.sh
      - name: Tests de API
        run: npm test
      - name: Tests de interfaz
        run: npm run test:ui
      - name: Capturas si fallan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Imagen Docker
        run: docker build --build-arg VERSION=ci -t hermesweb:ci .
      - name: Arranca
        run: |
          docker run --rm hermesweb:ci node -e "import('node-pty').then(()=>console.log('node-pty ok'))"
          docker run --rm hermesweb:ci sh -c 'tmux -V && git --version'
