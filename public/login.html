<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HermesWeb · Ingresar</title>
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    html, body { margin: 0; height: 100%; background: #0d1117; color: #d6dbe4; }
    body { display: grid; place-items: center; }
    form {
      width: min(340px, 90vw); background: #161b22; border: 1px solid #2a3140;
      border-radius: 12px; padding: 28px; display: flex; flex-direction: column; gap: 14px;
    }
    h1 { font-size: 20px; margin: 0 0 4px; }
    h1 span { color: #d97757; }
    p.sub { margin: 0 0 6px; color: #7d8590; font-size: 13px; }
    label { font-size: 12px; color: #7d8590; display: flex; flex-direction: column; gap: 6px; }
    input {
      font: 15px ui-sans-serif, system-ui, sans-serif; color: #d6dbe4; background: #0d1117;
      border: 1px solid #2a3140; border-radius: 7px; padding: 10px 12px;
    }
    input:focus { outline: none; border-color: #d97757; }
    button {
      font: inherit; font-weight: 600; padding: 10px; border-radius: 7px; cursor: pointer;
      background: #d97757; border: 1px solid #d97757; color: #fff;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .error { color: #f85149; font-size: 13px; min-height: 1.2em; margin: 0; }
  </style>
</head>
<body>
  <form id="f">
    <div>
      <h1>Hermes<span>Web</span></h1>
      <p class="sub">Tus sesiones de Claude Code</p>
    </div>
    <label>Contraseña
      <input type="password" name="password" autocomplete="current-password" autofocus required>
    </label>
    <p class="error" id="err"></p>
    <button id="btn">Ingresar</button>
  </form>
  <script>
    const f = document.getElementById('f'), err = document.getElementById('err'), btn = document.getElementById('btn');
    f.addEventListener('submit', async e => {
      e.preventDefault();
      btn.disabled = true; err.textContent = '';
      try {
        const r = await fetch('/api/login', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ password: f.password.value }),
        });
        if (r.ok) return location.replace('/' + location.hash);
        err.textContent = (await r.json()).error || 'Error';
        f.password.select();
      } catch { err.textContent = 'No se pudo conectar con el servidor'; }
      btn.disabled = false;
    });
  </script>
</body>
</html>
